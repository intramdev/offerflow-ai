{% extends "admin/base.html" %}

{% block title %}OfferFlow AI backend · {{ title }}{% endblock %}

{% block branding %}
<div id="of-branding">
  <svg id="of-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-hidden="true">
    <defs>
      <linearGradient id="ofg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#4f46e5"/>
        <stop offset="1" stop-color="#0d9488"/>
      </linearGradient>
    </defs>
    <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#ofg)"/>
    <g fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 24h20"/>
      <path d="M14 32h20"/>
      <path d="M14 40h14"/>
      <path d="M48 48c0-6-3-7-3-12s3-5 3-8"/>
      <path d="M41.5 28.5 48 22l6.5 6.5"/>
    </g>
  </svg>
  <div id="of-titles">
    <h1 id="site-name">
      <a href="{% url 'admin:index' %}">OfferFlow AI backend</a>
    </h1>
    <p id="site-tagline">Workspace administration</p>
  </div>
</div>
{% endblock %}

{% block extrastyle %}
{{ block.super }}
<style>
  :root {
    --of-indigo: #4f46e5;
    --of-teal: #0d9488;
    --of-deep: #312e81;
  }
  #header {
    background: linear-gradient(100deg, var(--of-indigo), var(--of-teal));
    color: #fff;
    padding: 1.1rem 2.5rem;
  }
  #header a:link, #header a:visited {
    color: #fff;
  }
  #of-branding {
    display: flex;
    align-items: center;
    gap: 1rem;
  }
  #of-logo {
    width: 52px;
    height: 52px;
    flex-shrink: 0;
  }
  #of-titles {
    display: flex;
    flex-direction: column;
    gap: 0.45rem;
  }
  #site-name {
    margin: 0;
    font-size: 1.35rem;
  }
  #site-tagline {
    margin: 0;
    font-size: 0.8rem;
    letter-spacing: 0.04em;
    opacity: 0.9;
  }
  #user-tools {
    font-size: 0.75rem;
  }
  div.breadcrumbs {
    background: var(--of-deep);
    color: #e0e7ff;
  }
  div.breadcrumbs a {
    color: #fff;
  }
  .module h2, .module caption, .inline-group h2 {
    background: var(--of-indigo);
  }
  a:link, a:visited {
    color: var(--of-indigo);
  }
  .button, input[type="submit"], input[type="button"], .submit-row input, a.button {
    background: var(--of-teal);
  }
  .button:hover, input[type="submit"]:hover, input[type="button"]:hover {
    background: #0b7d73;
  }
  .button.default, input[type="submit"].default, .submit-row input.default {
    background: var(--of-deep);
  }
</style>
{% endblock %}
